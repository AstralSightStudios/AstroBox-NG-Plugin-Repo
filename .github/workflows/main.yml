name: Generate Plugin Market Index

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "index.json"

permissions:
  contents: write

concurrency:
  group: plugin-market-index
  cancel-in-progress: false

jobs:
  generate-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate aggregated index.json from index.txt
        run: node scripts/generate-index.mjs

      - name: Commit index.json
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.json
          if git diff --cached --quiet --exit-code; then
            echo "No index changes."
            exit 0
          fi
          git commit -m "chore: regenerate plugin index"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed index.json (attempt ${attempt})."
              exit 0
            fi

            echo "::warning::push rejected on attempt ${attempt}; syncing with origin/${BRANCH} and regenerating"
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            node scripts/generate-index.mjs

            git add index.json
            if git diff --cached --quiet --exit-code; then
              echo "No index changes after syncing with origin/${BRANCH}."
              exit 0
            fi
            git commit -m "chore: regenerate plugin index"
            sleep $((attempt * 5))
          done

          echo "::error::failed to push regenerated index.json after 5 attempts"
          exit 1
